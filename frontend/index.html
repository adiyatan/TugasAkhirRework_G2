<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dompet &amp; Akun SOP — Sistem Rekonsiliasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              '"Plus Jakarta Sans"',
              "-apple-system",
              "BlinkMacSystemFont",
              '"Segoe UI"',
              "sans-serif",
            ],
            mono: ['"JetBrains Mono"', "ui-monospace", "SFMono-Regular", "monospace"],
          },
          colors: {
            canvas: "#F4F6FA",
            ink: "#0F172A",
            muted: "#475569",
            brand: "#2563EB",
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="font-sans min-h-screen pb-24 md:pb-16 selection:bg-blue-600 selection:text-white">

  <!-- Top Navigation Header (hanya tampil setelah login) -->
  <header id="app-header" class="hidden sticky top-0 z-30 backdrop-blur-xl bg-[#F4F6FA]/90 border-b border-slate-200/80">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <!-- Brand -->
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-2xl bg-slate-900 text-white flex items-center justify-center shadow-sm shrink-0" aria-hidden="true">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 12h5v4h-5a2 2 0 0 1 0-4Z" />
          </svg>
        </div>
        <div class="min-w-0">
          <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-500 truncate">
            PT Lokal Komoditi Indonesia
          </p>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-900 truncate">
            Dompet &amp; Akun SOP
          </h1>
        </div>
      </div>

      <!-- Desktop Pill Navbar (dirender dinamis sesuai role) -->
      <nav id="desktop-nav" aria-label="Navigasi Utama" class="hidden md:flex items-center gap-1 p-1 rounded-2xl bg-slate-200/75 shrink-0"></nav>

      <!-- Logout -->
      <button
        id="logout-btn"
        type="button"
        class="inline-flex items-center gap-1.5 h-9 px-3 rounded-xl text-xs font-semibold bg-white text-slate-700 border border-slate-200 hover:bg-slate-100 hover:text-slate-900 transition shrink-0"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" />
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 pt-6">
    <!-- Login View -->
    <section id="login-section" class="max-w-md mx-auto pt-4 sm:pt-8 view-animate">
      <div class="rounded-3xl bg-white border border-slate-200/90 p-6 sm:p-8 shadow-xs space-y-6">
        <div class="text-center space-y-2">
          <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 mx-auto flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c1.657 0 3-1.343 3-3S13.657 5 12 5 9 6.343 9 8s1.343 3 3 3Zm0 0c-3.314 0-6 2.015-6 4.5V18h12v-2.5c0-2.485-2.686-4.5-6-4.5Z" />
            </svg>
          </div>
          <h2 class="text-xl font-bold tracking-tight text-slate-900">Masuk ke Sistem</h2>
          <p class="text-xs text-slate-500">
            Gunakan akun sesuai role (<span class="font-semibold text-slate-700">Management</span>, <span class="font-semibold text-slate-700">Finance</span>, atau <span class="font-semibold text-slate-700">Staff</span>).
          </p>
        </div>

        <form id="login-form" class="space-y-4">
          <div class="space-y-1.5">
            <label for="login-username" class="block text-xs font-semibold text-slate-700">Username</label>
            <input
              id="login-username"
              type="text"
              autocomplete="username"
              placeholder="management / finance / staff"
              required
              class="w-full h-11 px-3.5 rounded-2xl bg-slate-50/70 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/25 focus:border-blue-600 transition"
            />
          </div>

          <div class="space-y-1.5">
            <label for="login-password" class="block text-xs font-semibold text-slate-700">Password</label>
            <input
              id="login-password"
              type="password"
              autocomplete="current-password"
              placeholder="Masukkan password"
              required
              class="w-full h-11 px-3.5 rounded-2xl bg-slate-50/70 border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600/25 focus:border-blue-600 transition"
            />
          </div>

          <p id="login-error" class="hidden rounded-xl bg-rose-50 border border-rose-200 px-3 py-2 text-xs font-medium text-rose-700"></p>

          <button
            type="submit"
            class="w-full h-11 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold shadow-xs transition active:scale-[0.99]"
          >
            Masuk
          </button>
        </form>

        <div class="pt-4 border-t border-slate-100 space-y-2">
          <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Akun Demo (Klik untuk isi)</p>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" data-demo-user="management" data-demo-pass="management123" class="demo-fill-btn px-2.5 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-semibold transition">
              Management
            </button>
            <button type="button" data-demo-user="finance" data-demo-pass="finance123" class="demo-fill-btn px-2.5 py-2 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-800 text-xs font-semibold transition">
              Finance
            </button>
            <button type="button" data-demo-user="staff" data-demo-pass="staff123" class="demo-fill-btn px-2.5 py-2 rounded-xl bg-violet-50 hover:bg-violet-100 text-violet-800 text-xs font-semibold transition">
              Staff
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- App View -->
    <div id="app-section" class="hidden space-y-5">
      <!-- Info Bar User Aktif -->
      <div class="rounded-2xl bg-white border border-slate-200/80 px-4 py-3 flex items-center justify-between gap-3 shadow-2xs">
        <div class="flex items-center gap-2.5 min-w-0">
          <span id="user-avatar" class="w-8 h-8 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold flex items-center justify-center shrink-0">U</span>
          <div class="min-w-0">
            <p id="user-name" class="text-sm font-bold text-slate-900 truncate">-</p>
            <p id="user-access-note" class="text-xs text-slate-500 truncate">-</p>
          </div>
        </div>
        <span id="user-role-pill" class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-bold uppercase tracking-wide shrink-0">-</span>
      </div>

      <!-- Kontainer Halaman Menu Aktif (diisi oleh masing-masing modul di js/menus/) -->
      <div id="menu-content"></div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar (dirender dinamis sesuai role) -->
  <nav
    id="mobile-nav"
    aria-label="Navigasi Bawah"
    class="hidden md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-xl border-t border-slate-200/90 pb-[env(safe-area-inset-bottom)]"
  ></nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
